<text x="24" y="1112" font-size="13" fill="#5B6475">Si la tienda rechaza la versión (20), se vuelve a construir (13) o a ajustar la ficha (16).</text>
<text x="24" y="1132" font-size="13" fill="#5B6475">La última etapa es continua: sus actividades (22 a 25) ocurren en paralelo durante la vida de la app.</text>
<text x="24" y="1152" font-size="13" fill="#5B6475">Canal Digital decide y es titular de las cuentas; TI responde por la tecnología; el ejecutor técnico puede ser TI interno o un tercero (V14).</text>
