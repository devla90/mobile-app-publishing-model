name: Watch official sources

on:
  schedule:
    - cron: "17 9 1 * *"   # 1st of every month, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare pages with the stored reference
        id: chk
        run: |
          set +e
          python3 generator/check_sources.py | tee report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue if anything changed
        if: steps.chk.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Review official sources (${date})`,
              labels: ['validation'],
              body: [
                'A page cited in `docs/validation.md` changed or did not respond.',
                'A page change does not mean the data point changed: the row has to be reviewed.',
                '',
                '**What to do:** open the repository with Claude Code and run `/validate-requirements`.',
                'When done, run `python3 generator/check_sources.py --update` and commit `generator/sources_hash.json`.',
                '',
                '```', report.trim(), '```'
              ].join('\n')
            });
