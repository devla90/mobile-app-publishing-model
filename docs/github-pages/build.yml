# Optional: publishes dist/ to GitHub Pages on every push to main.
# To enable it, copy this file to .github/workflows/build.yml and set
# Settings → Pages → Source: GitHub Actions. See docs/deployment.md#github-pages-optional.
name: Build and publish

on:
  push:
    branches: [main]
    paths: ["model/**", "clients/**", "generator/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and cross-references
        run: python3 generator/validate.py
      - name: Install Playwright (PNG export)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Build dist/
        run: python3 generator/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
